# Continuous integration: the required checks from AGENTS.md.
# Job descriptions and local reproduction steps: docs/ci.md.
#
# Third-party actions are pinned to full commit SHAs of releases at least
# 14 days old at adoption (AGENTS.md dependency rule). No secrets are used.

name: CI

on:
  # Not on pushes to master: only release, hotfix and chore pull requests
  # merge into it, and their pull request runs already tested the merge result. Releases
  # are tagged straight after the merge (AGENTS.md, docs/ci.md).
  push:
    branches: ["feature/**", "release/v*"]
  pull_request:
    branches: [master, "feature/**", "release/v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  # System libraries that Linux builds link through pkg-config, taken from the
  # -sys crates in Cargo.lock: webkit2gtk-sys, soup3-sys and
  # javascriptcore-rs-sys (Tauri's webview; this package pulls in the GTK 3,
  # GLib, Cairo, Pango, ATK and GdkPixbuf headers), gtk-sys, libdbus-sys (tao),
  # x11 (gdkx11-sys) and yeslogic-fontconfig-sys (egui system fonts).
  # eframe's winit/glutin stack dlopens X11, Wayland, xkbcommon and EGL, and
  # libappindicator-sys dlopens its library, so those need no build headers.
  # No crate links OpenSSL or librsvg.
  LINUX_BUILD_DEPS: >-
    libwebkit2gtk-4.1-dev
    libgtk-3-dev
    libdbus-1-dev
    libx11-dev
    libfontconfig-dev

jobs:
  # Gate for every job below.
  # - Pull requests into master: only from release/vX.Y.Z (matching the
  #   workspace version in Cargo.toml), hotfix/<issue>-<name> (an existing
  #   GitHub issue) or chore/* branches of this repository. Anything else fails
  #   here, and so fails ci-required.
  # - Other pull requests run CI only from release/v* branches; the rest skip
  #   it (ci-required reports skipped, which branch protection accepts).
  # - The checks skip, and ci-required passes, when the change touches only
  #   documentation (Markdown files and docs/).
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    outputs:
      run: ${{ steps.policy.outputs.run }}
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Branch policy
        id: policy
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$BASE_REF" != master ]; then
            case "$HEAD_REF" in
              release/v*) run=true ;;
              *) run=false; echo "Not a release branch; skipping CI." ;;
            esac
            echo "run=$run" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$HEAD_REPO" != "$REPO" ]; then
            echo "::error::Pull requests into master must come from a branch of $REPO, not $HEAD_REPO."
            exit 1
          fi
          case "$HEAD_REF" in
            release/*)
              if ! [[ "$HEAD_REF" =~ ^release/v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
                echo "::error::Release branch $HEAD_REF must be named release/vX.Y.Z."
                exit 1
              fi
              branch_version=${BASH_REMATCH[1]}
              version=$(git show "$PR_HEAD:Cargo.toml" | python3 -c 'import sys, tomllib; print(tomllib.loads(sys.stdin.read())["workspace"]["package"]["version"])')
              if [ "$version" != "$branch_version" ]; then
                echo "::error::$HEAD_REF does not match the workspace version $version in Cargo.toml."
                exit 1
              fi
              echo "Release $branch_version."
              ;;
            hotfix/*)
              if ! [[ "$HEAD_REF" =~ ^hotfix/([0-9]+)-[a-z0-9][a-z0-9-]*$ ]]; then
                echo "::error::Hotfix branch $HEAD_REF must be named hotfix/<issue>-<name>, for example hotfix/301-login-redirect."
                exit 1
              fi
              issue=${BASH_REMATCH[1]}
              if ! is_issue=$(gh api "repos/$REPO/issues/$issue" --jq '.pull_request == null' 2>/dev/null) || [ "$is_issue" != true ]; then
                echo "::error::$HEAD_REF references #$issue, which is not an issue in $REPO."
                exit 1
              fi
              echo "Hotfix for issue #$issue."
              ;;
            chore/*)
              echo "Chore branch."
              ;;
            *)
              echo "::error::Only release/vX.Y.Z, hotfix/<issue>-<name> and chore/* branches may merge into master, not $HEAD_REF."
              exit 1
              ;;
          esac
          echo "run=true" >> "$GITHUB_OUTPUT"
      - name: Detect code changes
        id: diff
        if: steps.policy.outputs.run == 'true'
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          case "$EVENT" in
            pull_request) range="$PR_BASE...$PR_HEAD" ;;
            push) range="$PUSH_BEFORE..$PUSH_AFTER" ;;
            *) range="" ;;
          esac
          # Manual runs, new branches (all-zero before) and force pushes whose
          # old head is gone: run everything.
          if [ -z "$range" ] || ! files=$(git diff --name-only "$range" 2>/dev/null); then
            echo "No usable diff range; running all checks."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$files"
          # Non-code: Markdown anywhere and everything under docs/.
          # (LICENSE is not listed: the GUI embeds it with include_str!.)
          code_files=$(echo "$files" | grep -vE '(\.md$|^docs/)' | grep -v '^$' || true)
          if [ -n "$code_files" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Documentation-only change; skipping checks."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  fmt:
    name: fmt
    needs: changes
    if: needs.changes.outputs.run == 'true' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install stable --profile minimal --component rustfmt --no-self-update
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    needs: changes
    if: needs.changes.outputs.run == 'true' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install system libraries
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086 # split the package list into words
          sudo apt-get install -y --no-install-recommends $LINUX_BUILD_DEPS
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install stable --profile minimal --component clippy --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Clippy (workspace, default features)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy (de440 feature)
        run: cargo clippy -p mooncalc-gui -p mooncalc-app -p mooncalc-tauri --all-targets --features de440 -- -D warnings

  test:
    name: test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.run == 'true' && needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086 # split the package list into words
          sudo apt-get install -y --no-install-recommends $LINUX_BUILD_DEPS
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install stable --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
      # DE440 kernel tests in mooncalc-spk skip without MOONCALC_DE440; the
      # separate DE440 workflow (de440.yml) runs them against de440s.bsp.
      - run: cargo test --workspace

  wasm:
    name: wasm
    needs: changes
    if: needs.changes.outputs.run == 'true' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust (rust-toolchain.toml) with the wasm target
        run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Build portable crates for wasm32
        run: cargo build --target wasm32-unknown-unknown -p mooncalc-core -p mooncalc-visibility -p mooncalc-maps -p mooncalc-hijri -p mooncalc-atlas -p mooncalc-app

  frontend:
    name: frontend
    needs: changes
    if: needs.changes.outputs.run == 'true' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend/tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/tauri/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run check

  # Single check for branch protection: passes only when every job above
  # succeeded, or when the checks were skipped for a documentation-only
  # change. Runs even when a dependency failed or was cancelled (including a
  # branch-policy failure in changes), so the check reports a failure rather
  # than staying skipped. Skipped (and so passing) only for pull requests the
  # gate exempts from CI: non-release pull requests into branches other than
  # master.
  ci-required:
    name: ci-required
    if: always() && needs.changes.outputs.run != 'false'
    needs: [changes, fmt, clippy, test, wasm, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ toJSON(needs) }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          # Documentation-only change: the checks were skipped on purpose.
          allowed='["success"]'
          if [ "$CODE" = "false" ]; then allowed='["success","skipped"]'; fi
          failed=$(echo "$RESULTS" | jq -r --argjson ok "$allowed" '[to_entries[] | select(.value.result as $r | $ok | any(. == $r) | not) | .key] | join(", ")')
          if [ -n "$failed" ]; then
            echo "::error::Required jobs did not succeed: $failed"
            exit 1
          fi
